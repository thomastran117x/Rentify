version: 2

# Group ordering is load-bearing: Dependabot assigns each dependency to the
# FIRST group whose criteria it matches, and anything matching no group gets an
# individual PR. The `*-security` groups come first so security fixes are never
# buried inside a large routine version-update PR, and the frontend `nextjs` /
# `react` groups come before the catch-all `dependency-type` groups so
# lockstep-pinned packages always move together.
#
# The catch-all `*-production` / `*-development` groups are limited to `minor`
# and `patch`, so an ordinary major arrives as its own reviewable PR.
#
# The `nextjs` and `react` groups deliberately include `major` as well. Those
# packages are version-locked to each other, so splitting a major across
# separate PRs would produce two PRs that each fail CI on their own.

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(backend)
      include: scope
    groups:
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
      backend-production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      backend-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(frontend)
      include: scope
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
      # next and eslint-config-next are exact-pinned and must move in lockstep,
      # so `major` is included here on purpose. Dropping it would push a major
      # out of this group and into two separate individual PRs.
      nextjs:
        applies-to: version-updates
        patterns:
          - next
          - eslint-config-next
          - "@next/*"
        update-types:
          - major
          - minor
          - patch
      # Same reasoning: react and react-dom must move together, and the
      # @types/* packages track them.
      react:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
          - minor
          - patch
      frontend-production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      frontend-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - mcp
    commit-message:
      prefix: chore(mcp)
      include: scope
    groups:
      mcp-security:
        applies-to: security-updates
        patterns:
          - "*"
      mcp-production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      mcp-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"
